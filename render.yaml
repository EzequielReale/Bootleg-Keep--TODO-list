services:
  - type: web
    name: hirelens-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hirelens-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SYNCHRONIZE
        value: "true" # Set to "true" on first deploy to auto-create database tables, then change to "false" to prevent data loss.
      - key: FRONTEND_URL
        value: https://hirelens-frontend.onrender.com # Update this with your actual frontend URL after deployment if different

  - type: web
    name: hirelens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://hirelens-backend.onrender.com/api # Automatically points to your backend URL (change if backend service name/URL changes)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hirelens-db
    databaseName: notes_app
    user: notes_user
    plan: free
